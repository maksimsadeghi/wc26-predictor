name: Scheduled Fetch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Write .env
        run: echo "VITE_API_FOOTBALL_KEY=${{ secrets.VITE_API_FOOTBALL_KEY }}" > .env

      - name: Write serviceAccount.json
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > serviceAccount.json

      - name: Run fetch
        run: npm run fetch
